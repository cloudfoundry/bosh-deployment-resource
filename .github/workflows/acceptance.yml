name: Docker CPI acceptance

on:
  pull_request:
    types:
      - opened
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name in reusable runs, so release runs don't cancel main pushes.
  group: docker-cpi-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.repository == 'cloudfoundry/bosh-deployment-resource'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
      - name: Install acl
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y acl
      - name: Test resource against disposable instant-bosh Director
        run: bash .github/acceptance/run.sh
