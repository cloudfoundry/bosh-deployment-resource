name: Build and publish resource image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v2.14.1
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to publish, or commit SHA to verify
        required: true
        type: string
      verify_only:
        description: Run all checks without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/cloudfoundry/bosh-deployment-resource
  RELEASE_TAG: ${{ inputs.ref || inputs.tag || github.ref_name }}

jobs:
  unit:
    name: Unit tests
    uses: ./.github/workflows/go.yml
    with:
      ref: ${{ inputs.ref || inputs.tag || github.ref_name }}

  acceptance:
    name: Acceptance tests
    uses: ./.github/workflows/acceptance.yml
    with:
      ref: ${{ inputs.ref || inputs.tag || github.ref_name }}

  test:
    name: Test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: resource
          pull: true
          platforms: ${{ matrix.platform }}
          tags: bosh-deployment-resource:test-${{ matrix.architecture }}
          load: true

      - name: Test resource entrypoints
        env:
          IMAGE: bosh-deployment-resource:test-${{ matrix.architecture }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$EXPECTED_ARCH"
          test "$(printf '{"source":{"skip_check":true}}' | docker run --rm -i "$IMAGE" /opt/resource/check)" = '[]'
          for entrypoint in in out; do
            docker run --rm "$IMAGE" test -x "/opt/resource/$entrypoint"
          done

  scan:
    name: Scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          target: resource
          pull: true
          platforms: linux/amd64
          tags: bosh-deployment-resource:scan
          load: true

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bosh-deployment-resource:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish image
    if: github.repository == 'cloudfoundry/bosh-deployment-resource' && !inputs.verify_only
    needs:
      - unit
      - acceptance
      - test
      - scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: resource
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
