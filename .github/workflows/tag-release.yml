name: Tag Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 28 * *'  # Monthly on the 28th at 00:00 UTC

permissions:
  contents: write

concurrency:
  group: tag-patch-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'cloudfoundry/bosh-deployment-resource' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create and push next release tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: ${{ github.event.repository.default_branch }}
          tag_prefix: v
          create_annotated_tag: true
          fetch_all_tags: true

      - name: Summarize release
        if: steps.tag.outputs.new_tag != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "Tagged $COMMIT_SHA as $NEW_TAG." >> "$GITHUB_STEP_SUMMARY"

  # Tags pushed with GITHUB_TOKEN do not trigger the image workflow's push event.
  image:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
